:root{--bg:#000;--fg:#f2f3f7;--mut:#9aa0b4;--blue:#2f5bff;--vio:#7a3cff;--line:#23263a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--fg);font:400 17px/1.65 Manrope,system-ui,sans-serif}
h1,h2{font-family:Unbounded,system-ui,sans-serif;font-weight:700;line-height:1.1;margin:0}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:1.2rem;align-items:center;padding:.8rem 1.2rem;background:rgba(0,0,0,.8);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
nav a{color:var(--mut);text-decoration:none;font-size:.9rem}nav a:hover,nav a:focus-visible{color:var(--fg)}
nav select{margin-left:auto;background:#0c0e18;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:.35rem .5rem;font:inherit;font-size:.85rem}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.hero{min-height:92vh;display:grid;place-items:center;text-align:center;padding:2rem 1.2rem;background:radial-gradient(60% 50% at 50% 38%,rgba(47,91,255,.35),rgba(122,60,255,.15) 55%,transparent 75%)}
.stage{perspective:900px;width:min(78vw,500px);aspect-ratio:784/420;margin:0 auto 1.5rem}
.logo{position:relative;width:100%;height:100%;transform-style:preserve-3d}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 49%;mix-blend-mode:screen}
.hero h1{font-size:clamp(1.8rem,6vw,3.6rem);letter-spacing:.04em}
.tag{background:linear-gradient(90deg,#c9ccd6,var(--blue),var(--vio));-webkit-background-clip:text;background-clip:text;color:transparent;font-family:Unbounded,sans-serif;font-size:clamp(.9rem,2.4vw,1.2rem);margin:1rem 0}
.hero p{max-width:60ch;margin:0 auto;color:var(--mut)}
.sig{margin-top:1.4rem;color:var(--mut);font-size:.9rem}
section.s{max-width:900px;margin:0 auto;padding:4.5rem 1.2rem;border-top:1px solid var(--line)}
section.s h2{font-size:clamp(1.4rem,4vw,2.1rem);margin-bottom:1.2rem}
section.s p{max-width:68ch;color:#cfd2de;margin:0 0 1rem}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:1.5rem}
.slot{border:1px solid var(--line);border-radius:14px;padding:1rem;background:linear-gradient(160deg,#0c0f20,#06060d);transition:border-color .25s,transform .25s}
.slot:hover{border-color:var(--blue);transform:translateY(-3px)}
.slot b{display:block;font-family:Unbounded,sans-serif;font-size:.85rem;font-weight:500}
.slot span{color:var(--mut);font-size:.85rem}
.bar{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:1.2rem;max-width:320px}
.bar i{display:block;height:100%;width:30%;background:linear-gradient(90deg,var(--blue),var(--vio));animation:sl 2.8s ease-in-out infinite alternate}
@keyframes sl{to{margin-left:70%}}
.soc{display:flex;flex-wrap:wrap;gap:12px;margin-top:1rem}
.soc a,.soc span{border:1px solid var(--line);border-radius:999px;padding:.5rem 1.1rem;color:var(--fg);text-decoration:none;font-size:.95rem}
.soc a:hover{border-color:var(--blue)}
footer{border-top:1px solid var(--line);padding:2.5rem 1.2rem;text-align:center;color:var(--mut);font-size:.9rem}
@media (prefers-reduced-motion:reduce){.bar i{animation:none}.slot{transition:none}html{scroll-behavior:auto}}

var sel=document.getElementById('lang');
function setLang(l){
  if(!T[l])l='en';
  document.documentElement.lang=l;sel.value=l;
  document.querySelectorAll('[data-i]').forEach(function(e){e.textContent=T[l][e.dataset.i]});
  try{localStorage.setItem('bryn-lang',l)}catch(e){}
}
sel.addEventListener('change',function(){setLang(sel.value)});
var start='en';try{start=localStorage.getItem('bryn-lang')||'en'}catch(e){}
setLang(start);

var logo=document.getElementById('logo'),N=11,GAP=5;
for(var i=0;i<N;i++){
  var im=new Image();im.src=LOGO;im.alt=i===N-1?'BRYN':'';im.draggable=false;
  im.style.transform='translateZ('+((i-(N-1)/2)*GAP)+'px)';
  im.style.opacity=i===N-1||i===0?1:.55+.04*i;
  im.style.filter=i<N-1?'brightness('+(.35+.05*i)+')':'none';
  logo.appendChild(im);
}
var ang=0,mx=0,my=0,last=performance.now(),still=matchMedia('(prefers-reduced-motion:reduce)').matches;
function tilt(x,y){var r=logo.getBoundingClientRect();mx=(x/innerWidth-.5)*30;my=(y/innerHeight-.5)*-30}
addEventListener('pointermove',function(e){tilt(e.clientX,e.clientY)});
addEventListener('touchmove',function(e){var t=e.touches[0];tilt(t.clientX,t.clientY)},{passive:true});
function frame(t){
  var dt=t-last;last=t;
  if(!still)ang=(ang+dt*0.03)%360;
  logo.style.transform='rotateX('+my+'deg) rotateY('+(ang+mx)+'deg)';
  requestAnimationFrame(frame);
}
if(still){logo.style.transform='rotateY(-15deg)'}else{requestAnimationFrame(frame)}
